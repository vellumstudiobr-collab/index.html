<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061329">
<title>VELLUM — Experiência Premium</title>
<style>
:root{
  --bg:#030814;
  --blue:#168bff;
  --blue-light:#8ed7ff;
  --blue-deep:#0754d7;
  --white:#f5faff;
  --muted:#9cb5d5;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100svh;overflow:hidden;background:var(--bg);color:var(--white)}
button,a{-webkit-tap-highlight-color:transparent}
.scene{
  position:relative;isolation:isolate;display:grid;place-items:center;
  width:100%;min-height:100svh;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 43%,#10356a 0%,#091a38 31%,#050d1d 62%,#02050d 100%);
}
.scene:before{
  content:"";position:absolute;inset:0;z-index:-3;opacity:.35;
  background-image:linear-gradient(#61baff0a 1px,transparent 1px),linear-gradient(90deg,#61baff0a 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:linear-gradient(to bottom,transparent 4%,#000 45%,#000 85%,transparent);
}
.grid{
  position:absolute;z-index:-2;left:-40%;right:-40%;bottom:-48%;height:85%;
  transform:perspective(560px) rotateX(64deg);transform-origin:top center;
  background-image:linear-gradient(#2e9dff2b 1px,transparent 1px),linear-gradient(90deg,#2e9dff2b 1px,transparent 1px);
  background-size:52px 52px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 70%,transparent);
  animation:gridmove 12s linear infinite;
}
.aurora{
  position:absolute;z-index:-2;width:min(85vw,760px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#168bff35 0%,#0c65e51b 35%,transparent 69%);
  filter:blur(24px);animation:aurora 7s ease-in-out infinite;
}
.ring{
  position:absolute;width:min(78vw,590px);aspect-ratio:1;border:1px solid #59baff45;border-radius:50%;
  transform:rotateX(68deg) rotateZ(-18deg);
  box-shadow:0 0 65px #168bff18,inset 0 0 48px #168bff12;
  animation:orbit 22s linear infinite;
}
.ring:before,.ring:after{content:"";position:absolute;inset:11%;border:1px solid #8ed7ff25;border-radius:50%}
.ring:after{inset:23%;border-color:#168bff2d}
.content{
  width:min(92%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:32px 0 64px;animation:enter 1.1s cubic-bezier(.2,.8,.2,1) both;
}
.logo-wrap{
  position:relative;width:145px;height:145px;display:grid;place-items:center;margin-bottom:28px;
  transform-style:preserve-3d;animation:float 5s ease-in-out infinite;
}
.logo-wrap:before{
  content:"";position:absolute;inset:0;border:1px solid #76caff9c;border-radius:34px;
  transform:rotate(45deg);background:linear-gradient(135deg,#1b8fff20,#05142a66);
  box-shadow:0 0 32px #168bff2d,inset 0 0 28px #168bff12;backdrop-filter:blur(8px);
}
.logo-wrap:after{content:"";position:absolute;inset:13px;border:1px solid #8ed7ff42;border-radius:25px;transform:rotate(45deg)}
.logo{width:95px;height:95px;z-index:1;filter:drop-shadow(0 0 17px #168bff88)}
.brand{
  font-size:clamp(2.8rem,10vw,5.5rem);font-weight:850;letter-spacing:.24em;
  margin:0 0 13px .24em;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#bfe7ff 38%,#4baaff 72%,#eaf8ff 100%);
  background-clip:text;-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 26px #168bff2d);
}
.tagline{font-size:clamp(.68rem,2.5vw,.9rem);letter-spacing:.25em;text-transform:uppercase;color:#b8d5f5;margin:0 0 34px}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.primary,.social-toggle{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-width:178px;padding:15px 23px;border:1px solid #5ebaffb0;border-radius:999px;
  color:#fff;background:linear-gradient(135deg,#168bff42,#0b4caa36);
  font-size:.76rem;font-weight:750;letter-spacing:.16em;text-decoration:none;cursor:pointer;overflow:hidden;
  box-shadow:0 10px 38px #00102caa,inset 0 1px #ffffff30;
  transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;
}
.primary:before,.social-toggle:before{
  content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(100deg,transparent,#ffffff30,transparent);transition:transform .7s;
}
.primary:hover,.social-toggle:hover{transform:translateY(-3px);border-color:#a6ddff;box-shadow:0 14px 45px #087cff38,inset 0 1px #ffffff45}
.primary:hover:before,.social-toggle:hover:before{transform:translateX(130%)}
.arrow{font-size:1.1rem;transition:transform .25s}
.primary:hover .arrow{transform:translate(3px,-2px)}
.social-panel{
  display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-8px) scale(.98);
  transition:grid-template-rows .35s ease,opacity .25s ease,transform .35s ease;
  width:min(100%,390px);margin-top:0;pointer-events:none;
}
.social-panel.open{grid-template-rows:1fr;opacity:1;transform:translateY(0) scale(1);margin-top:17px;pointer-events:auto}
.social-inner{overflow:hidden;min-height:0}
.social-links{
  display:flex;justify-content:center;gap:12px;padding:4px 2px 8px;
}
.social-link{
  flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 15px;border:1px solid #6ebeff55;border-radius:15px;
  background:linear-gradient(135deg,#0d2c53dd,#06152ddd);color:#edf8ff;text-decoration:none;
  font-size:.86rem;font-weight:650;box-shadow:0 8px 25px #0004;
  transition:transform .2s,border-color .2s,background .2s;
}
.social-link:hover{transform:translateY(-2px);border-color:#65bdff;background:#0d3670}
.social-link svg{width:19px;height:19px;flex:none}
.hint{color:#88a9d0;font-size:.69rem;letter-spacing:.04em;margin:7px 0 0}
.footer{
  position:absolute;bottom:22px;left:15px;right:15px;text-align:center;
  font-size:.61rem;letter-spacing:.23em;color:#7697c2;text-transform:uppercase;
}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#bde8ff;box-shadow:0 0 13px #168bff;opacity:.5;animation:twinkle 3s ease-in-out infinite}
.s1{left:18%;top:25%}.s2{right:19%;top:30%;animation-delay:1s}.s3{left:25%;bottom:22%;animation-delay:1.7s}.s4{right:27%;bottom:24%;animation-delay:.5s}
@keyframes enter{from{opacity:0;transform:translateY(24px) rotateX(8deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotateY(-7deg)}50%{transform:translateY(-10px) rotateY(7deg)}}
@keyframes aurora{0%,100%{opacity:.65;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes orbit{to{transform:rotateX(68deg) rotateZ(342deg)}}
@keyframes gridmove{to{background-position:0 52px,52px 0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.5)}}
@media(max-width:480px){
  .logo-wrap{width:120px;height:120px}.logo{width:79px;height:79px}
  .tagline{letter-spacing:.13em;line-height:1.7;max-width:290px}
  .ring{width:95vw}.footer{font-size:.52rem;letter-spacing:.13em}
  .actions{width:100%;flex-direction:column}.primary,.social-toggle{width:min(100%,290px)}
  .social-links{gap:8px}.social-link{padding:12px 9px;font-size:.78rem}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene">
  <div class="grid" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="ring" aria-hidden="true"></div>
  <i class="spark s1" aria-hidden="true"></i><i class="spark s2" aria-hidden="true"></i>
  <i class="spark s3" aria-hidden="true"></i><i class="spark s4" aria-hidden="true"></i>

  <section class="content" aria-label="Abertura VELLUM">
    <div class="logo-wrap" aria-label="Símbolo VELLUM">
      <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Símbolo V">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".45" stop-color="#8ed7ff"/>
            <stop offset="1" stop-color="#168bff"/>
          </linearGradient>
        </defs>
        <path d="M13 19 L31 19 L50 66 L69 19 L87 19 L57 83 L43 83 Z" fill="url(#metal)"/>
        <path d="M31 19 L50 66 L57 83 L43 83 L13 19 Z" fill="#fff" opacity=".14"/>
      </svg>
    </div>

    <h1 class="brand">VELLUM</h1>
    <p class="tagline">Sua próxima experiência começa aqui</p>

    <div class="actions">
      <a class="primary" href="https://kakarotinho01gg-oss.github.io/index.html/" id="enterButton" target="_blank" rel="noopener noreferrer">ENTRAR <span class="arrow">↗</span></a>
      <button class="social-toggle" id="socialToggle" type="button" aria-expanded="false" aria-controls="socialPanel">
        <span id="socialLabel">REDES SOCIAIS</span><span class="arrow" id="socialArrow">＋</span>
      </button>
    </div>

    <div class="social-panel" id="socialPanel" aria-hidden="true">
      <div class="social-inner">
        <div class="social-links">
          <!-- Perfis oficiais da VELLUM conectados. -->
          <a class="social-link" href="https://www.instagram.com/vellum.storebr?rpxt=MTFzaWhteTgwbnZu" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg> Instagram
          </a>
          <a class="social-link" href="https://youtube.com/@vellum_digital?si=wWw07hR56WuCGoc_" target="_blank" rel="noopener noreferrer" aria-label="Abrir YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
            </svg> YouTube
          </a>
        </div>
        <p class="hint">Conecte-se com a VELLUM</p>
      </div>
    </div>
  </section>

  <div class="footer">VELLUM STUDIO · CRIATIVIDADE SEM LIMITES</div>
</main>

<script>
(() => {
  const enterButton = document.getElementById('enterButton');
  const socialToggle = document.getElementById('socialToggle');
  const socialPanel = document.getElementById('socialPanel');
  const socialLabel = document.getElementById('socialLabel');
  const socialArrow = document.getElementById('socialArrow');

  // O botão ENTRAR abre o site conectado em uma nova aba.

  socialToggle.addEventListener('click', () => {
    const isOpen = socialToggle.getAttribute('aria-expanded') === 'true';
    socialToggle.setAttribute('aria-expanded', String(!isOpen));
    socialPanel.classList.toggle('open', !isOpen);
    socialPanel.setAttribute('aria-hidden', String(isOpen));
    socialLabel.textContent = isOpen ? 'REDES SOCIAIS' : 'FECHAR REDES';
    socialArrow.textContent = isOpen ? '＋' : '−';
  });
})();
</script>
</body>
</html>
